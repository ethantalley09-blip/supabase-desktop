[package]
name = "lynx"
version = "1.0.0"
description = "Lynx — campaign and advocacy organizing platform"
license = "MIT"
repository = "https://github.com/ethantalley09-blip/supabase-desktop"
edition = "2021"
rust-version = "1.57"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# Feature list must cover every allowlist entry in tauri.conf.json:
# clipboard/shell/window (boilerplate) + dialog-all, fs read/write/create/
# exists, http-request (added for export, voter import, and geocoding).
tauri = { version = "1.2", features = [
  "clipboard-all",
  "shell-all",
  "window-all",
  "dialog-all",
  "fs-read-file",
  "fs-write-file",
  "fs-create-dir",
  "fs-exists",
  "http-request"
] }

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort" # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true # Enables link to optimizations
opt-level = "s" # Optimize for binary size
strip = true  # Automatically strip symbols from the binary.
